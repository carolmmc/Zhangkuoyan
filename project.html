<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Carol Zhang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Julius+Sans+One&display=swap" rel="stylesheet">
  <style>
    :root{--blue:#c7e8f8;--ink:#111;--accent:#3d83b7;--line:#b8dcef;--serif:Georgia,'Times New Roman',serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Julius Sans One',sans-serif;color:var(--ink)}body{background:#fff}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}a{color:inherit;text-decoration:none}
    .topbar{height:84px;display:flex;align-items:center;gap:6vw;padding:0 5.3vw;border-bottom:1px solid #e4e4e4;background:#fff;position:relative;z-index:10}.wordmark{font-family:'Foxlite Script','Brush Script MT',cursive;font-size:25px}.topnav{display:flex;justify-content:space-between;align-items:center;flex:1;gap:2vw}.topnav a{font-size:16px;letter-spacing:.04em;white-space:nowrap}.topnav a:hover,.topnav a.active{font-weight:700}
    .page{min-height:calc(100vh - 84px)}.index-page{padding:28px 3.2vw 6vw;display:grid;grid-template-columns:230px 1fr;gap:3vw}.side{padding-top:3px}.side h1{font-size:24px;margin:0 0 22px;font-weight:700}.side-list{display:flex;flex-direction:column;align-items:flex-start;gap:11px}.side-list button{font-size:15px;text-align:left;line-height:1.35;max-width:210px}.side-list button::before{content:'›';display:inline-block;width:20px;font-size:23px;vertical-align:-2px}.side-list button:hover,.side-list button.active{font-weight:700;color:var(--accent)}.side-list button.active::before{content:'⌄'}
    .bookmarks{height:calc(100vh - 155px);min-height:720px;display:flex;justify-content:center;align-items:flex-end;gap:clamp(14px,2.25vw,34px);overflow-x:auto;padding:42px 0 24px;scrollbar-width:none}.bookmarks::-webkit-scrollbar{display:none}.bookmark{position:relative;width:clamp(132px,12.5vw,190px);height:clamp(400px,72vh,690px);flex:0 0 auto;box-shadow:0 5px 12px rgba(0,0,0,.14);transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s ease;cursor:pointer;background:#eee;--mouse-x:50%;--mouse-y:50%;isolation:isolate}.bookmark:nth-child(2){height:84%}.bookmark:nth-child(3){height:78%}.bookmark:nth-child(4){height:82%}.bookmark:nth-child(5){height:86%}.bookmark:nth-child(6){height:76%}.bookmark::before{content:'';position:absolute;inset:-10px;background:radial-gradient(circle 120px at var(--mouse-x) var(--mouse-y),rgba(61,131,183,.32),transparent 70%);opacity:0;transition:opacity .35s ease;z-index:-1;pointer-events:none}.bookmark::after{content:'';position:absolute;inset:-6px;border:1px solid transparent;transition:border-color .35s ease,box-shadow .35s ease;pointer-events:none}.bookmark:hover{transform:translateY(-10px) rotate(-.35deg);box-shadow:0 18px 32px rgba(25,71,98,.2),0 4px 8px rgba(0,0,0,.12)}.bookmark:hover::before{opacity:1}.bookmark:hover::after,.bookmark:focus-visible::after{border-color:var(--accent);box-shadow:0 0 0 4px rgba(61,131,183,.1)}.bookmark:focus-visible{outline:none}.bookmark img{width:100%;height:100%;display:block;object-fit:cover}
    .detail-page{background:var(--blue);padding:20px 3vw 7vw;display:grid;grid-template-columns:230px 1fr;gap:3vw}.detail-content{max-width:1200px}.crumbs{display:flex;align-items:center;gap:9px;font-size:15px;margin-bottom:6px}.crumbs button:hover{text-decoration:underline}.detail-content h1{font-family:var(--serif);font-size:clamp(45px,6vw,84px);line-height:.95;color:var(--accent);margin:12px 0 20px;max-width:1000px}.detail-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(220px,.75fr);gap:3vw;align-items:start}.detail-hero{width:100%;max-height:760px;object-fit:cover;object-position:top;border-radius:18px;display:block}.facts{color:var(--accent);padding-top:12px}.fact{margin:0 0 34px}.fact h2{font-family:var(--serif);font-size:29px;margin:0 0 8px}.fact p{font-family:Arial,sans-serif;font-size:16px;line-height:1.6;margin:0;color:#265f87}.detail-description{max-width:800px;color:#265f87;font-family:Arial,sans-serif;font-size:17px;line-height:1.75;margin:30px 0 0}.switcher{display:flex;gap:26px;margin-top:30px;color:var(--accent)}.switcher button:hover{text-decoration:underline}
    @media(max-width:900px){.topbar{height:auto;min-height:76px;align-items:flex-start;padding:18px 20px;gap:20px;overflow-x:auto}.topnav{gap:22px}.topnav a{font-size:12px}.index-page,.detail-page{display:block;padding:20px}.side{margin-bottom:22px}.bookmarks{justify-content:flex-start;min-height:0;padding:20px 4px 35px;gap:20px}.bookmark{width:150px;height:440px!important}.detail-grid{display:block}.detail-hero{margin-bottom:28px}.detail-content h1{font-size:50px}.facts{padding-top:0}}
    /* Figma-inspired arch layout */
    .index-page{background:#fff;padding-top:40px;padding-bottom:20px;height:calc(100vh - 84px);min-height:760px;overflow:hidden}
    .bookmarks{height:calc(100vh - 145px);min-height:760px;align-items:center;gap:clamp(12px,1.7vw,28px);padding:40px 0 50px;overflow:visible}
    .bookmark{width:clamp(125px,11.5vw,176px);height:clamp(390px,68vh,650px)}
    .bookmark:nth-child(1){transform:translateY(150px) rotate(-2deg)}
    .bookmark:nth-child(2){transform:translateY(65px) rotate(-1deg)}
    .bookmark:nth-child(3){transform:translateY(0) rotate(-.4deg)}
    .bookmark:nth-child(4){transform:translateY(-25px) rotate(.4deg)}
    .bookmark:nth-child(5){transform:translateY(65px) rotate(1deg)}
    .bookmark:nth-child(6){transform:translateY(150px) rotate(2deg)}
    .bookmark:hover{transform:translateY(-12px) rotate(0deg) scale(1.02)}
    @media(max-width:900px){.index-page{padding-top:20px}.bookmarks{height:auto;min-height:0;align-items:flex-end;overflow-x:auto;padding:30px 4px 45px}.bookmark:nth-child(n){transform:none}.bookmark:hover{transform:translateY(-10px) scale(1.02)}}
    /* Project details now live on project-detail.html. */
    #detail-view{display:none!important}
    .detail-page{background:#fff}
    .detail-page .crumbs{display:none}
  </style>
</head>
<body>
  <header class="topbar"><a class="wordmark" href="index.html">Carol Zhang</a><nav class="topnav"><a href="index.html">HOME</a><a class="active" href="project.html">PROJECTS</a><a href="photo-film/index.html">PHOTO &amp; FILM</a><a href="about.html">ABOUT ME</a><a href="contact.html">CONTACT</a></nav></header>
  <main id="index-view" class="page index-page">
    <aside class="side"><h1>⌄ PROJECTS</h1><div id="project-list" class="side-list"></div></aside>
    <section id="bookmark-list" class="bookmarks" aria-label="Project bookmarks"></section>
  </main>
  <main id="detail-view" class="page detail-page" hidden>
    <aside class="side"><h1>⌄ PROJECTS</h1><div id="detail-project-list" class="side-list"></div></aside>
    <section class="detail-content"><div class="crumbs"><button id="back-button">‹ PROJECTS</button><span>/</span><span id="detail-number"></span></div><h1 id="detail-title"></h1><div class="detail-grid"><img id="detail-image" class="detail-hero" alt=""><div id="detail-facts" class="facts"></div></div><p id="detail-description" class="detail-description"></p><div class="switcher"><button id="previous-button">← Previous</button><button id="next-button">Next →</button></div></section>
  </main>
  <script>
    const projects=[
      {title:'Eco-Link & Refuge Link',image:'project-01-eco-link.webp',service:'A hybrid learning and support system for climate-displaced communities.',duration:'2025.02–05',type:'Personal project',users:'Environmentally displaced communities',desc:'Eco-Link + Refuge Link combines a physical card-based board game with AR events and a digital support platform. It turns climate displacement into an experience that can be understood, discussed and acted on.'},
      {title:'BodyLens',image:'project-02-bodylens.webp',service:'A calm interface for understanding personal health signals.',duration:'2024–2025',type:'Research-led project',users:'People experiencing health anxiety',desc:'BodyLens helps people record symptoms and body signals without amplifying health anxiety. A body map, symptom timeline and privacy-aware information experience support clearer conversations with care providers.'},
      {title:'Trace Back',image:'project-03-trace-back.webp',service:'A sensory VR system for post-exercise recovery.',duration:'2025',type:'Physical computing project',users:'Young adults after night exercise',desc:'Trace Back explores the transition from post-exercise alertness to sleep through heart-rate, breathing and gentle multisensory feedback.'},
      {title:'Wheel Cycle',image:'project-04-wheel-cycle.webp',service:'A circular service system for shared bicycles.',duration:'2024',type:'Service design project',users:'Shared-bike riders and city communities',desc:'Wheel Cycle connects reporting, repair, reuse and community participation so abandoned shared bicycles can return to public life.'},
      {title:'CuddlePods',image:'project-05-cuddlepods.png',service:'A tangible companion for long-distance partners.',duration:'2024',type:'Tangible interaction project',users:'People in long-distance relationships',desc:'CuddlePods translates touch, warmth and light into a low-burden way for people in long-distance relationships to feel each other’s presence.'},
      {title:'Airth',image:'project-06-airth.webp',service:'A 3D healing game based on emotional weather.',duration:'2024',type:'Immersive experience project',users:'Young adults seeking gentle emotional support',desc:'Airth turns emotional states into a responsive world where weather, exploration and companionship create a gentle space for reflection.'}
    ];
    let selected=0;
    const $=id=>document.getElementById(id);
    function listMarkup(){return projects.map((p,i)=>`<button data-index="${i}" class="${i===selected?'active':''}">${String(i+1).padStart(2,'0')} ${p.title}</button>`).join('')}
    function renderLists(){ $('project-list').innerHTML=listMarkup();$('detail-project-list').innerHTML=listMarkup();document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>openDetail(Number(b.dataset.index))); }
    function renderBookmarks(){ $('bookmark-list').innerHTML=projects.map((p,i)=>`<button class="bookmark" data-index="${i}" aria-label="Open ${p.title}"><img src="${p.image}" alt="${p.title}"></button>`).join('');document.querySelectorAll('.bookmark').forEach(b=>{b.onclick=()=>openDetail(Number(b.dataset.index));b.onpointermove=e=>{const r=b.getBoundingClientRect();b.style.setProperty('--mouse-x',`${e.clientX-r.left}px`);b.style.setProperty('--mouse-y',`${e.clientY-r.top}px`)};b.onpointerleave=()=>{b.style.setProperty('--mouse-x','50%');b.style.setProperty('--mouse-y','50%')}}); }
    function openDetail(i){selected=i;const p=projects[i];$('index-view').hidden=true;$('detail-view').hidden=false;$('detail-number').textContent=String(i+1).padStart(2,'0');$('detail-title').textContent=p.title;$('detail-image').src=p.image;$('detail-image').alt=p.title;$('detail-facts').innerHTML=`<div class="fact"><h2>Service</h2><p>${p.service}</p></div><div class="fact"><h2>Duration</h2><p>${p.duration}<br><em>${p.type}</em></p></div><div class="fact"><h2>Target Users</h2><p>${p.users}</p></div>`;$('detail-description').textContent=p.desc;renderLists();window.scrollTo({top:0,behavior:'smooth'});}
    function showIndex(){$('detail-view').hidden=true;$('index-view').hidden=false;renderLists();window.scrollTo({top:0,behavior:'smooth'});}
    $('back-button').onclick=showIndex;$('previous-button').onclick=()=>openDetail((selected+projects.length-1)%projects.length);$('next-button').onclick=()=>openDetail((selected+1)%projects.length);renderLists();renderBookmarks();openDetail=(i)=>{const audio=new Audio('sound-folder-close.wav');audio.volume=.18;window.projectTransitionSound=audio;audio.play().catch(()=>{});setTimeout(()=>{location.href=`project-detail.html?project=${i}`},180)};
  </script>
</body>
</html>
